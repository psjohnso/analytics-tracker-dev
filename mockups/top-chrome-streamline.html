<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top-chrome streamlining — concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#002669; --orange:#C24200; --yellow:#FFDB22; --green:#83AC16;
    --border:#E1E2DD; --text-body:#002855; --text-muted:#6B7280;
    --surface:#F3F1EB; --surface-2:#EDEAE1; --white:#ffffff;
    --pill-blue-bg:#EEF2FF; --pill-blue-fg:#002669;
    --shadow:0 6px 22px rgba(0,0,0,0.14);
  }
  body[data-theme="dark"] {
    --navy:#6E9BD6; --border:#343B45; --text-body:#E6E9ED; --text-muted:#9AA2AC;
    --surface:#14171D; --surface-2:#2A2F38; --white:#20242C;
    --pill-blue-bg:rgba(110,155,214,0.18); --pill-blue-fg:#A9C8F0;
    --shadow:0 6px 22px rgba(0,0,0,0.5); color-scheme:dark;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Lato',Arial,sans-serif; background:var(--surface); color:var(--text-body); font-size:14px; }

  /* dev switcher (not part of the brand mock) */
  .devbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:#1b1f27; color:#fff; padding:10px 16px; position:sticky; top:0; z-index:200; }
  .devbar .lbl { font-size:11px; letter-spacing:0.08em; text-transform:uppercase; font-weight:800; opacity:0.7; }
  .devbtn { font-family:inherit; font-size:12.5px; font-weight:700; color:#cfd6e0; background:#2a2f3a; border:1px solid #3a4150; border-radius:7px; padding:7px 12px; cursor:pointer; }
  .devbtn.on { background:#fff; color:#1b1f27; border-color:#fff; }
  .devbar .grow { flex:1; }
  .bandcount { font-size:12px; font-weight:800; background:#2a2f3a; border:1px solid #3a4150; border-radius:20px; padding:5px 12px; }
  .bandcount b { color:#9ae6b4; }

  /* ── shared brand chrome ─────────────────────────────────── */
  .appheader { display:flex; align-items:center; gap:14px; background:var(--navy); color:#fff; padding:0 20px; height:60px; }
  body[data-theme="dark"] .appheader { background:#0D1117; }
  .ah-logo { display:flex; align-items:center; gap:11px; }
  .ah-mark { width:30px; height:30px; border-radius:6px; background:linear-gradient(135deg,#fff,#dbe4f5); color:var(--navy); font-weight:900; font-size:13px; display:flex; align-items:center; justify-content:center; }
  .ah-title { line-height:1.15; }
  .ah-title .t { font-weight:900; font-size:15px; letter-spacing:0.02em; }
  .ah-title .s { font-family:'Cardo',Georgia,serif; font-style:italic; font-size:11.5px; opacity:0.82; }
  .ah-ver { font-size:10px; background:rgba(255,255,255,0.15); padding:2px 7px; border-radius:4px; font-weight:700; align-self:center; }
  .ah-stats { display:flex; gap:7px; margin-left:8px; }
  .stat { background:rgba(255,255,255,0.10); border-radius:7px; padding:5px 11px; text-align:center; min-width:62px; }
  .stat .n { font-weight:900; font-size:16px; line-height:1; }
  .stat .l { font-size:9.5px; opacity:0.78; text-transform:uppercase; letter-spacing:0.04em; margin-top:2px; }
  .ah-right { margin-left:auto; display:flex; align-items:center; gap:9px; }
  .ah-icon { width:32px; height:32px; border-radius:7px; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.18); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:15px; }
  .ah-icon:hover { background:rgba(255,255,255,0.22); }
  .ah-pill { font-size:11px; font-weight:700; background:rgba(255,255,255,0.92); color:var(--navy); border:1px solid rgba(255,255,255,0.5); border-radius:6px; padding:5px 9px; cursor:pointer; }
  body[data-theme="dark"] .ah-pill { background:#2A2F38; color:#F2F4F7; border-color:#4A5360; }
  .ah-submit { font-size:12.5px; font-weight:800; background:var(--yellow); color:#92400E; border:none; border-radius:7px; padding:8px 14px; cursor:pointer; letter-spacing:0.02em; }
  .ah-out { font-size:11px; font-weight:700; color:rgba(255,255,255,0.9); border:1.5px solid rgba(255,255,255,0.5); background:transparent; border-radius:5px; padding:5px 11px; cursor:pointer; }
  .ah-rolebadge { font-size:9px; font-weight:800; letter-spacing:0.05em; text-transform:uppercase; background:rgba(131,172,22,0.85); color:#fff; padding:1px 6px; border-radius:3px; }
  .ah-userwrap { position:relative; }
  .ah-userbtn { display:flex; align-items:center; gap:7px; cursor:pointer; background:transparent; border:none; color:#fff; font-family:inherit; }
  .ah-av { width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; }
  .ah-uname { font-size:12.5px; font-weight:700; }
  .usermenu { position:absolute; top:calc(100% + 8px); right:0; min-width:230px; background:var(--white); color:var(--text-body); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); padding:7px; display:none; z-index:120; }
  .usermenu.open { display:block; }
  .um-head { padding:8px 10px 10px; border-bottom:1px solid var(--border); margin-bottom:5px; }
  .um-head .nm { font-weight:800; font-size:13px; }
  .um-head .rl { font-size:11px; color:var(--text-muted); }
  .um-item { display:flex; align-items:center; gap:9px; padding:8px 10px; font-size:12.5px; font-weight:600; border-radius:6px; cursor:pointer; }
  .um-item:hover { background:var(--surface-2); }
  .um-item .ic { width:16px; text-align:center; }
  .um-item .chev { margin-left:auto; opacity:0.5; font-size:11px; }
  .um-stats { display:flex; gap:6px; padding:6px 8px 2px; }
  .um-stat { flex:1; background:var(--surface-2); border-radius:6px; padding:6px; text-align:center; }
  .um-stat .n { font-weight:900; font-size:15px; color:var(--navy); }
  .um-stat .l { font-size:9px; color:var(--text-muted); text-transform:uppercase; }

  /* tab bar */
  .tabbar { display:flex; align-items:center; gap:3px; background:var(--white); padding:0 16px; border-bottom:1px solid var(--border); }
  .tab { padding:13px 14px; font-size:13.5px; font-weight:700; color:var(--text-muted); cursor:pointer; border-bottom:3px solid transparent; }
  .tab.active { color:var(--navy); border-bottom-color:var(--navy); }
  .tab.more { color:var(--text-muted); }
  .tab .cnt { font-size:10px; background:var(--surface-2); border-radius:9px; padding:1px 6px; margin-left:4px; font-weight:800; }
  .tabbar .grow { flex:1; }
  .util { display:flex; align-items:center; gap:8px; }
  .util-icon { width:30px; height:30px; border-radius:7px; border:1px solid var(--border); background:var(--white); color:var(--text-muted); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px; }
  .util-icon:hover { border-color:var(--navy); color:var(--navy); }
  .util-link { font-size:12.5px; font-weight:700; color:var(--text-muted); cursor:pointer; }
  .unsaved-dot { width:8px; height:8px; border-radius:50%; background:var(--orange); }
  .submit-inline { font-size:12.5px; font-weight:800; background:var(--yellow); color:#92400E; border:none; border-radius:7px; padding:7px 13px; cursor:pointer; }

  /* sub tabs */
  .subbar { display:flex; align-items:center; gap:4px; background:var(--surface); padding:8px 16px 0; border-bottom:1px solid var(--border); }
  .subtab { padding:8px 13px; font-size:13px; font-weight:700; color:var(--text-muted); border-radius:8px 8px 0 0; cursor:pointer; }
  .subtab.active { color:var(--navy); background:var(--white); border:1px solid var(--border); border-bottom-color:var(--white); }

  /* segmented control (inline sub-tabs) */
  .segmented { display:inline-flex; background:var(--surface-2); border-radius:8px; padding:3px; gap:2px; }
  .seg { font-size:12.5px; font-weight:700; color:var(--text-muted); padding:5px 12px; border-radius:6px; cursor:pointer; }
  .seg.on { background:var(--white); color:var(--navy); box-shadow:0 1px 2px rgba(0,0,0,0.08); }

  .accent { height:4px; background:linear-gradient(90deg,#C24200 25%,#FFDB22 25%,#FFDB22 50%,#83AC16 50%,#83AC16 75%,#002669 75%); }

  /* toolbar / control strip */
  .toolbar2 { display:flex; align-items:center; gap:10px; padding:11px 16px; background:var(--surface); flex-wrap:wrap; }
  .controlstrip { display:flex; align-items:center; gap:10px; padding:10px 16px; background:var(--surface); border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .tb-count { font-family:'Cardo',Georgia,serif; font-style:italic; color:var(--text-muted); font-size:14px; }
  .tb-btn { font-size:12.5px; font-weight:700; color:var(--navy); border:1.5px solid var(--border); background:var(--white); border-radius:7px; padding:7px 11px; cursor:pointer; }
  .tb-btn.q { color:var(--green); border-color:var(--green); }
  .tb-btn.q2 { color:var(--orange); border-color:var(--orange); }
  .tb-btn.idea { color:#92400E; border-color:var(--yellow); }
  .grow { flex:1; }
  .sortsel { font-size:12.5px; font-weight:700; color:var(--navy); border:1.5px solid var(--border); background:var(--white); border-radius:7px; padding:7px 10px; }
  .viewtoggle { display:inline-flex; border:1.5px solid var(--border); border-radius:7px; overflow:hidden; }
  .vt { padding:6px 10px; font-size:13px; cursor:pointer; color:var(--text-muted); background:var(--white); }
  .vt.on { background:var(--navy); color:#fff; }

  /* preset bar */
  .presetbar2 { display:flex; align-items:center; gap:8px; padding:10px 16px; background:var(--surface); border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .pgl { font-size:10px; letter-spacing:0.08em; text-transform:uppercase; font-weight:800; color:var(--text-muted); }
  .pchip { font-size:12.5px; font-weight:700; color:var(--text-body); background:var(--white); border:1.5px solid var(--border); border-radius:18px; padding:6px 13px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .pchip.on { background:var(--navy); color:#fff; border-color:var(--navy); }
  body[data-theme="dark"] .pchip.on { color:#0D1117; }
  .pchip .star { color:var(--yellow); -webkit-text-stroke:0.4px #C99A00; }
  .pchip.save { color:var(--green); border-color:var(--green); background:transparent; }
  .pdiv { width:1px; height:20px; background:var(--border); }

  /* content */
  .content { padding:18px 16px 50px; }
  .kpi-note { font-size:12px; color:var(--text-muted); font-style:italic; background:var(--pill-blue-bg); color:var(--pill-blue-fg); border-radius:8px; padding:8px 12px; margin-bottom:14px; }
  table { width:100%; border-collapse:collapse; background:var(--white); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  th { text-align:left; font-size:11px; letter-spacing:0.05em; text-transform:uppercase; color:#fff; background:var(--navy); padding:9px 12px; font-weight:800; }
  body[data-theme="dark"] th { background:var(--white); color:var(--text-muted); }
  td { padding:9px 12px; font-size:13px; border-bottom:1px solid var(--border); }
  tr:last-child td { border-bottom:none; }
  .num { font-family:monospace; color:var(--text-muted); font-size:12px; }
  .spill { font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; }
  .notewrap { font-size:12px; color:var(--text-muted); margin:14px 2px 0; font-style:italic; }
</style>
</head>
<body>
  <div class="devbar">
    <span class="lbl">Concept</span>
    <button class="devbtn" data-c="current" onclick="setConcept('current')">Current (busy)</button>
    <button class="devbtn" data-c="A" onclick="setConcept('A')">A · Full streamline</button>
    <button class="devbtn" data-c="B" onclick="setConcept('B')">B · Slim header</button>
    <button class="devbtn" data-c="C" onclick="setConcept('C')">C · Merged control</button>
    <button class="devbtn" data-c="D" onclick="setConcept('D')">D · Tabs + utilities</button>
    <span class="grow"></span>
    <span class="bandcount" id="bandcount"></span>
    <button class="devbtn" onclick="toggleTheme()" id="themebtn">🌙 Dark</button>
  </div>

  <div id="mock"></div>

<script>
/* ---- reusable chrome pieces ---- */
function logo(){ return '<div class="ah-logo"><div class="ah-mark">CoT</div><div class="ah-title"><div class="t">Project Tracker</div><div class="s">City of Tucson · Information Technology</div></div></div>'; }
function ver(){ return '<span class="ah-ver">v1.52</span>'; }
function statsTiles(){ return '<div class="ah-stats">'+
  '<div class="stat"><div class="n">12</div><div class="l">Active</div></div>'+
  '<div class="stat"><div class="n">76</div><div class="l">Open Tasks</div></div>'+
  '<div class="stat"><div class="n">8</div><div class="l">Complete</div></div>'+
  '<div class="stat"><div class="n">28</div><div class="l">Total</div></div></div>'; }

function userMenu(withStats){
  return '<div class="usermenu" id="usermenu">'+
    '<div class="um-head"><div class="nm">Peter Johnson</div><div class="rl">Admin · Data Intelligence team</div></div>'+
    (withStats ? '<div class="um-stats"><div class="um-stat"><div class="n">12</div><div class="l">Active</div></div><div class="um-stat"><div class="n">76</div><div class="l">Open</div></div><div class="um-stat"><div class="n">28</div><div class="l">Total</div></div></div>' : '')+
    '<div class="um-item"><span class="ic">👁</span>View as team<span class="chev">▾</span></div>'+
    '<div class="um-item"><span class="ic">🎭</span>Act as role<span class="chev">▾</span></div>'+
    '<div class="um-item"><span class="ic">⏱</span>Timers</div>'+
    '<div class="um-item"><span class="ic">⚙</span>Preferences</div>'+
    '<div class="um-item"><span class="ic">↩</span>Sign out</div>'+
  '</div>';
}
function userBtn(showName){ return '<div class="ah-userwrap"><button class="ah-userbtn" onclick="toggleUserMenu(event)"><span class="ah-av">PJ</span>'+(showName?'<span class="ah-uname">Peter ▾</span>':'<span class="ah-uname">▾</span>')+'</button>'+userMenu(true)+'</div>'; }

/* full (busy) header */
function headerCurrent(){
  return '<div class="appheader">'+logo()+ver()+statsTiles()+
    '<div class="ah-right">'+
      '<div class="ah-icon" title="Timers">⏱</div>'+
      '<div class="ah-icon" title="Notifications">🔔</div>'+
      '<span class="ah-av" style="background:rgba(255,255,255,0.2);">PJ</span>'+
      '<span style="font-size:12.5px;font-weight:700;">Peter Johnson</span>'+
      '<span class="ah-rolebadge">Admin</span>'+
      '<span class="ah-pill">View as team ▾</span>'+
      '<span class="ah-pill">Act as role ▾</span>'+
      '<button class="ah-out">Sign out</button>'+
    '</div></div>';
}
/* slim header — stats gone, controls in avatar menu */
function headerSlim(withSubmit){
  return '<div class="appheader">'+logo()+
    '<div class="ah-right">'+
      (withSubmit ? '<button class="ah-submit">💡 Submit Idea</button>' : '')+
      '<div class="ah-icon" title="Notifications">🔔</div>'+
      userBtn(true)+
    '</div></div>';
}

/* primary tabs */
function primaryTabs(opts){
  opts = opts || {};
  var active = opts.active || 'Portfolio';
  var tabs = ['Overview','My Work','Portfolio','Capacity','Analytics','Slideshow'];
  var h = '<div class="tabbar">';
  tabs.forEach(function(t){ h += '<div class="tab'+(t===active?' active':'')+'">'+t+'</div>'; });
  h += '<div class="tab more">⋯ More <span class="cnt">10</span></div>';
  h += '<span class="grow"></span>';
  if (opts.utilities === 'full') {
    h += '<div class="util"><span class="unsaved-dot" title="Unsaved changes"></span>'+
      '<button class="submit-inline">💡 Submit Idea</button>'+
      '<span class="util-link">🔄 Refresh</span>'+
      '<span class="util-link">About / Help</span></div>';
  } else if (opts.utilities === 'icons') {
    h += '<div class="util"><span class="unsaved-dot" title="Unsaved changes"></span>'+
      '<div class="util-icon" title="Refresh data">🔄</div>'+
      '<div class="util-icon" title="Export CSV">⬇</div>'+
      '<div class="util-icon" title="About / Help">?</div></div>';
  }
  // inline contextual sub-tabs (Option D)
  if (opts.inlineSub) {
    h = h.replace('<span class="grow"></span>', '<span style="width:18px;"></span><div class="segmented"><div class="seg on">Projects</div><div class="seg">Tasks</div><div class="seg">Review</div></div><span class="grow"></span>');
  }
  h += '</div>';
  return h;
}

function subTabs(){
  return '<div class="subbar">'+
    '<div class="subtab active">Projects <span style="opacity:0.6;">28</span></div>'+
    '<div class="subtab">Tasks <span style="opacity:0.6;">76</span></div>'+
    '<div class="subtab">Project Review</div></div>';
}
function accent(){ return '<div class="accent"></div>'; }

function toolbarFull(){
  return '<div class="toolbar2">'+
    '<span class="tb-count">28 projects</span>'+
    '<button class="tb-btn">◀ Filters</button>'+
    '<button class="tb-btn">＋ New</button>'+
    '<button class="tb-btn idea">💡 Review Ideas</button>'+
    '<button class="tb-btn q">📂 Open Projects</button>'+
    '<button class="tb-btn q2">✅ Open Tasks</button>'+
    '<span class="grow"></span>'+
    '<select class="sortsel"><option>Sort: Title A–Z</option></select>'+
    '<span class="viewtoggle"><span class="vt">⊞</span><span class="vt on">☰</span><span class="vt">📅</span></span>'+
  '</div>';
}
function presetBar(){
  return '<div class="presetbar2"><span class="pgl">Views</span>'+
    '<span class="pchip on">All</span><span class="pchip">My work</span><span class="pchip">Open</span><span class="pchip">Overdue</span><span class="pchip">High priority</span>'+
    '<span class="pdiv"></span>'+
    '<span class="pchip"><span class="star">★</span>Police work ⋯</span><span class="pchip">Governance — High ⋯</span>'+
    '<button class="pchip save">💾 Save view</button></div>';
}
/* merged control strip (Option C / A) */
function controlStrip(){
  return '<div class="controlstrip">'+
    '<div class="segmented"><div class="seg on">Projects</div><div class="seg">Tasks</div><div class="seg">Review</div></div>'+
    '<span class="pchip on">All</span><span class="pchip">My work</span><span class="pchip">Open</span><span class="pchip">Overdue</span><span class="pchip">High</span>'+
    '<span class="pchip"><span class="star">★</span>Police ⋯</span>'+
    '<button class="pchip save">💾</button>'+
    '<span class="grow"></span>'+
    '<span class="tb-count">28</span>'+
    '<button class="tb-btn">◀ Filters</button>'+
    '<button class="tb-btn">＋ New</button>'+
    '<select class="sortsel"><option>Sort</option></select>'+
    '<span class="viewtoggle"><span class="vt">⊞</span><span class="vt on">☰</span><span class="vt">📅</span></span>'+
  '</div>';
}

/* content */
function content(showKpiNote){
  var rows = [
    ['P-330','Application Development Standards & Governance','Active','#83AC16','High','#C24200'],
    ['P-342','Finalize DGEC Charter w/ Exec Committee','Active','#83AC16','High','#C24200'],
    ['P-188','Police Use-of-Force Dashboard','Active','#83AC16','High','#C24200'],
    ['P-277','Open Data Portal Refresh','Active','#83AC16','Medium','#C99A00'],
    ['P-309','Master Data Management Strategy','Active','#83AC16','High','#C24200'],
    ['P-201','Water Quality Sampling Data Pipeline','Active','#83AC16','Medium','#C99A00']
  ];
  var body = rows.map(function(r){
    return '<tr><td class="num">'+r[0]+'</td><td style="font-weight:700;">'+r[1]+'</td>'+
      '<td><span class="spill" style="background:'+r[3]+'22;color:'+r[3]+';">'+r[2]+'</span></td>'+
      '<td><span class="spill" style="background:'+r[5]+'22;color:'+r[5]+';">'+r[4]+'</span></td></tr>';
  }).join('');
  return '<div class="content">'+
    (showKpiNote ? '<div class="kpi-note">ℹ The four KPI tiles (Active / Open Tasks / Complete / Total) move to the Overview tab and the avatar menu, freeing the header.</div>' : '')+
    '<table><thead><tr><th>ID</th><th>Project</th><th>Status</th><th>Priority</th></tr></thead><tbody>'+body+'</tbody></table>'+
    '<div class="notewrap" id="notewrap"></div>'+
  '</div>';
}

/* ---- concepts ---- */
var CONCEPTS = {
  current: { bands:6, note:'Current layout — header (logo+title+version+4 KPI tiles+6 user controls), primary tabs + 4 utilities, sub-tabs, accent, toolbar (6 buttons), preset bar. Six stacked bands before content.',
    render:function(){ return headerCurrent()+primaryTabs({utilities:'full'})+subTabs()+accent()+toolbarFull()+presetBar()+content(false); } },
  A: { bands:3, note:'A · Full streamline — slim header (KPI tiles → Overview + avatar menu; team/role/timers/sign-out tucked in the ▾ menu; Submit Idea is the one header CTA). Primary tabs with utilities as icons. ONE control strip = sub-tabs (segmented) + presets + count/Filters/New/Sort/view. Six bands → three.',
    render:function(){ return headerSlim(true)+primaryTabs({utilities:'icons'})+accent()+controlStrip()+content(true); } },
  B: { bands:5, note:'B · Slim header only — same big win up top (no KPI tiles; all user controls in the avatar ▾ menu), but the tab/sub-tab/toolbar/preset rows are left exactly as they are today. Lowest-risk change.',
    render:function(){ return headerSlim(false)+primaryTabs({utilities:'full'})+subTabs()+accent()+toolbarFull()+presetBar()+content(true); } },
  C: { bands:4, note:'C · Merged control strip — header and tabs unchanged; sub-tabs + toolbar + preset bar collapse into ONE strip, and the redundant Open Projects / Open Tasks / Review Ideas buttons are dropped (the Open preset covers them).',
    render:function(){ return headerCurrent()+primaryTabs({utilities:'full'})+accent()+controlStrip()+content(false); } },
  D: { bands:5, note:'D · Tabs + utilities — header unchanged; the two tab rows become one: sub-tabs become an inline segmented control on the active group, Refresh/Export/Help become icons, and Submit Idea moves into the header. Toolbar + preset bar stay.',
    render:function(){ return headerSlim(true)+primaryTabs({utilities:'icons', inlineSub:true})+accent()+toolbarFull()+presetBar()+content(true); } }
};

var cur = 'current';
function setConcept(c){
  cur = c;
  document.querySelectorAll('.devbtn[data-c]').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-c')===c); });
  var def = CONCEPTS[c];
  document.getElementById('mock').innerHTML = def.render();
  document.getElementById('bandcount').innerHTML = 'Bands above content: <b>'+def.bands+'</b>';
  var nw = document.getElementById('notewrap'); if (nw) nw.textContent = def.note;
  closeUserMenu();
}
function toggleUserMenu(e){ e.stopPropagation(); var m=document.getElementById('usermenu'); if(m) m.classList.toggle('open'); }
function closeUserMenu(){ var m=document.getElementById('usermenu'); if(m) m.classList.remove('open'); }
document.addEventListener('click', function(e){ if(!e.target.closest || !e.target.closest('.ah-userwrap')) closeUserMenu(); });
function toggleTheme(){ var d=document.body.getAttribute('data-theme')==='dark'; document.body.setAttribute('data-theme', d?'':'dark'); document.getElementById('themebtn').textContent = d?'🌙 Dark':'☀ Light'; }

setConcept('current');
</script>
</body>
</html>
